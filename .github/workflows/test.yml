name: Test Inno Setup Installation

on:
  workflow_dispatch:

jobs:
  test-innosetup:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - name: 🛠️ Checkout code (empty)
      uses: actions/checkout@v4

    - name: 🧪 Download and Install Inno Setup
      shell: pwsh
      run: |
        # Download
        $installerPath = "$env:RUNNER_TEMP\innosetup.exe"
        Write-Output "Downloading Inno Setup..."
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/ispack.exe" -OutFile $installerPath -UseBasicParsing

        # Install
        Write-Output "Installing silently..."
        Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/NORESTART", "/DIR=C:\InnoSetup" -Wait -NoNewWindow

        # Verify
        if (Test-Path "C:\InnoSetup\ISCC.exe") {
            Write-Output "✔ Installation successful!"
            echo "C:\InnoSetup" >> $env:GITHUB_PATH
        } else {
            Write-Error "❌ Installation failed"
            exit 1
        }

    - name: ✅ Verify Installation
      shell: pwsh
      run: |
        # Create test ISS file
        $issContent = @"
[Setup]
AppName=TestApp
AppVersion=1.0
DefaultDirName={autopf}\TestApp
OutputDir=output
OutputBaseFilename=TestSetup
"@
        New-Item -ItemType Directory -Path output -Force | Out-Null
        Set-Content -Path "test.iss" -Value $issContent

        # Compile test installer
        ISCC test.iss

        # Verify output
        if (Test-Path "output\TestSetup.exe") {
            Write-Output "✔ Compilation successful!"
        } else {
            Write-Error "❌ Compilation failed"
            exit 1
        }
