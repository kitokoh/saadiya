on:
  workflow_dispatch:

  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Inno Setup
      uses: ammaraskar/setup-innosetup@v1
      with:
        version: '6.2.0'  # Version d'Inno Setup

    - name: Build installer
      run: |
        iscc /O"LeopardoAI-Installer" /F"Nova360" "your_script_name.iss"
      shell: cmd
      
    - name: Upload artifact
      uses: actions/upload-artifact@v2
      with:
        name: LeopardoAI-Installer
        path: LeopardoAI-Installer/Nova360.exe
