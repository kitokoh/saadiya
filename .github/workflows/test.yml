name: Test Upload Artifact

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: windows-latest

    steps:
    - name: Create a test file
      run: |
        echo "Hello LeopardoAI!" > test-output.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-artifact
        path: test-output.txt
