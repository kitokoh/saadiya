name: Test Inno Setup Installation with Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0-test'

jobs:
  test-innosetup:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - name: 🛠️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Step 1: Install Inno Setup (portable)
    - name: 🧪 Install Inno Setup
      shell: pwsh
      run: |
        $version = "6.2.2"
        $installDir = "C:\InnoSetup"
        Write-Output "Downloading Inno Setup Portable $version..."
        Invoke-WebRequest -Uri "https://github.com/innosetup/innosetup/releases/download/$version/innosetup-$version.zip" -OutFile "$env:RUNNER_TEMP\innosetup.zip"
        Expand-Archive -Path "$env:RUNNER_TEMP\innosetup.zip" -DestinationPath $installDir -Force
        echo "$installDir" >> $env:GITHUB_PATH

    # Step 2: Create test installer
    - name: 🏗️ Create Test Installer
      shell: pwsh
      run: |
        $issContent = @"
[Setup]
AppName=Test Setup
AppVersion=1.0
DefaultDirName={autopf}\TestApp
OutputDir=output
OutputBaseFilename=TestSetup
"@
        New-Item -ItemType Directory -Path output -Force | Out-Null
        Set-Content -Path "test.iss" -Value $issContent
        ISCC test.iss

    # Step 3: Create release with test installer
    - name: 🚀 Create Test Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.tag }}
        name: "Inno Setup Test Release (${{ github.event.inputs.tag }})"
        body: "This is a test release verifying Inno Setup installation"
        files: |
          output/TestSetup.exe
