name: Release Leopardo

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Upload release exe
        uses: softprops/action-gh-release@v1
        with:
          files: public/leopardo.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
