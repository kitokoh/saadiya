name: Build Leopardo AI Executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt', 'main.spec', 'resources/**']

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'Leopardo AI'
  UPX_VERSION: '4.2.1'

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: 🛠️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔍 Get commit messages since last tag
      id: commit-analyzer
      run: |
        # Trouver le dernier tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"
        
        # Extraire la version numérique
        CURRENT_VERSION=${LATEST_TAG#v}
        echo "Current version: $CURRENT_VERSION"
        
        # Analyser les commits depuis le dernier tag
        COMMITS=$(git log --pretty=format:"%s" $LATEST_TAG..HEAD)
        echo "Commits since last tag:"
        echo "$COMMITS"
        
        # Déterminer le type de changement (major, minor, patch)
        CHANGE_TYPE="patch"
        if [[ "$COMMITS" =~ (feat:|feature:|major:) ]]; then
          CHANGE_TYPE="minor"
        fi
        if [[ "$COMMITS" =~ (breaking change:|break:|major:) ]]; then
          CHANGE_TYPE="major"
        fi
        
        echo "Change type: $CHANGE_TYPE"
        echo "change-type=$CHANGE_TYPE" >> $GITHUB_OUTPUT
        echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
    
    - name: 📌 Generate new version
      id: version
      run: |
        IFS='.' read -ra VERSION_PARTS <<< "${{ steps.commit-analyzer.outputs.current-version }}"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}
        
        case "${{ steps.commit-analyzer.outputs.change-type }}" in
          "major")
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          "minor")
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          *)
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        echo "New version: $NEW_VERSION"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: versioning
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.versioning.outputs.version }}

    steps:
    - name: 🛠️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install PyQt5==5.15.10 pymysql psycopg2-binary cryptography
        pip install -r requirements.txt

    - name: 🔽 Download UPX
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "upx"
        echo "UPX_DIR=$pwd\upx\upx-${{ env.UPX_VERSION }}-win64" >> $env:GITHUB_ENV

    - name: 🔍 Verify resources and DLLs
      shell: pwsh
      run: |
        $requiredDirs = @('resources', 'dlls', 'lesClesNova360')
        foreach ($dir in $requiredDirs) {
          if (-not (Test-Path $dir)) {
              Write-Error "❌ Dossier manquant: $dir"
              exit 1
          }
        }

        $requiredDlls = @('liblzma.dll', 'libssl-3-x64.dll', 'libcrypto-3-x64.dll')
        foreach ($dll in $requiredDlls) {
          if (-not (Test-Path "dlls\$dll")) {
              Write-Error "❌ DLL manquante: $dll"
              exit 1
          }
        }

    - name: 🧹 Clean previous builds
      run: |
        Remove-Item -Recurse -Force build, dist, output, release -ErrorAction SilentlyContinue

    - name: 🔨 Build with PyInstaller
      shell: pwsh
      run: |
        $env:PYTHONPATH="$pwd"
        pyinstaller main.spec --noconfirm --clean --upx-dir "$env:UPX_DIR" --distpath "dist" --workpath "build"

        if (-not (Test-Path "dist\main.exe")) {
          Write-Error "❌ Compilation échouée"
          Get-Content "build\warn-main.txt" -ErrorAction SilentlyContinue
          exit 1
        }

    - name: 📂 Debug – Fichiers disponibles
      shell: cmd
      run: dir /s /b

    - name: 📤 Upload main.exe
      uses: actions/upload-artifact@v4
      with:
        name: main-exe
        path: dist/main.exe

    - name: ⬇️ Download Inno Setup
      run: |
        Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "is.exe"
        Start-Process .\is.exe "/VERYSILENT /NORESTART /SP-" -Wait

    - name: ➕ Add Inno Setup to PATH
      run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append $env:GITHUB_PATH

    - name: 📝 Update version in Inno Setup script
      run: |
        (Get-Content main.iss).Replace('MyAppVersion ""', "MyAppVersion ""${{ env.APP_VERSION }}""") | Set-Content main.iss
        (Get-Content main.iss).Replace('OutputBaseFilename=Leopardo-ai', "OutputBaseFilename=Leopardo-ai-${{ env.APP_VERSION }}") | Set-Content main.iss

    - name: 📦 Build installer with Inno Setup
      run: ISCC.exe main.iss

    - name: 📤 Upload installer exe
      uses: actions/upload-artifact@v4
      with:
        name: LeopardoAI-installer
        path: LeopardoAI-Installer/Leopardo-ai-${{ env.APP_VERSION }}.exe

    - name: 🏷 Create git tag
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git tag -a v${{ env.APP_VERSION }} -m "Version ${{ env.APP_VERSION }}"
        git push origin v${{ env.APP_VERSION }}

    - name: 🏷 Update 'latest' tag
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git tag -f latest
        git push origin --force latest

    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "Leopardo AI v${{ env.APP_VERSION }}"
        tag_name: v${{ env.APP_VERSION }}
        files: |
          dist/main.exe
          LeopardoAI-Installer/Leopardo-ai-${{ env.APP_VERSION }}.exe
        body: |
          🚀 Nouvelle version de Leopardo AI (v${{ env.APP_VERSION }})
          
          Contenu :
          - 🧠 Executable : main.exe
          - 📦 Installateur : Leopardo-ai-${{ env.APP_VERSION }}.exe

          Généré automatiquement via GitHub Actions.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
