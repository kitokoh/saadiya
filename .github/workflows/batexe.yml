name: BAT to EXE Converter

on:
  push:
    branches: [main]
    paths: ['lesclesnova360/icons/batofexe/*.bat']
  workflow_dispatch:

jobs:
  convert:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create output directory
      run: New-Item -Path "lesclesnova360/icons/exes" -ItemType Directory -Force

    - name: Install PS2EXE
      run: |
        # Téléchargement de ps2exe.ps1
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MScholtes/PS2EXE/master/ps2exe.ps1" -OutFile "ps2exe.ps1"

    - name: Convert BAT to EXE
      run: |
        $batFiles = Get-ChildItem -Path "lesclesnova360/icons/batofexe" -Filter *.bat
        
        foreach ($batFile in $batFiles) {
          $ps1Path = "$($batFile.DirectoryName)/$($batFile.BaseName).ps1"
          $exePath = "lesclesnova360/icons/exes/$($batFile.BaseName).exe"
          
          # Conversion BAT vers PS1
          @"
# Converti depuis $($batFile.Name)
`$batContent = @'
$(Get-Content -Path $batFile.FullName -Raw)
'@
`$lines = `$batContent -split "`r`n"
foreach (`$line in `$lines) {
    if (`$line -match "^::") { continue }
    if (`$line -match "^@") { continue }
    if (`$line -match "^ECHO OFF") { continue }
    Invoke-Expression `$line
}
"@ | Out-File -FilePath $ps1Path -Encoding utf8

          # Compilation PS1 vers EXE
          .\ps2exe.ps1 -inputFile $ps1Path -outputFile $exePath -noConsole -noOutput
          
          # Nettoyage
          Remove-Item $ps1Path -Force
          
          if (Test-Path $exePath) {
            Write-Host "Fichier EXE créé : $exePath"
          } else {
            Write-Error "Échec de la création de $exePath"
            exit 1
          }
        }

    - name: Verify EXE files
      run: |
        $exeFiles = Get-ChildItem -Path "lesclesnova360/icons/exes" -Filter *.exe
        if ($exeFiles.Count -eq 0) {
          Write-Error "Aucun fichier EXE créé !"
          exit 1
        }
        Write-Host "$($exeFiles.Count) fichiers EXE créés avec succès"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compiled-exes
        path: lesclesnova360/icons/exes/*.exe
        retention-days: 3
