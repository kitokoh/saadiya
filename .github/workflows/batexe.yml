name: PS1 to EXE Converter

on:
  push:
    branches: [main]
    paths: ['lesclesnova360/icons/batofexe/*.ps1']
  workflow_dispatch:

jobs:
  convert:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create output directory
        run: New-Item -Path "lesclesnova360/icons/exes" -ItemType Directory -Force
        shell: pwsh

      - name: ⬇️ Download PS2EXE
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MScholtes/PS2EXE/master/Module/ps2exe.ps1" -OutFile "ps2exe.ps1"
        shell: pwsh

      - name: ⚙️ Convert PS1 to EXE
        run: |
          . .\ps2exe.ps1  # Charger le script dans la session actuelle

          $ps1Files = Get-ChildItem -Path "lesclesnova360/icons/batofexe" -Filter *.ps1

          foreach ($ps1File in $ps1Files) {
            $exePath = "lesclesnova360/icons/exes/$($ps1File.BaseName).exe"

            Invoke-ps2exe -inputFile $ps1File.FullName -outputFile $exePath -noConsole -noOutput

            if (Test-Path $exePath) {
              Write-Host "✅ Created: $exePath"
            } else {
              Write-Error "❌ Failed to create $exePath"
              exit 1
            }
          }
        shell: pwsh

      - name: 🔍 Verify results
        run: |
          $exes = Get-ChildItem -Path "lesclesnova360/icons/exes" -Filter *.exe
          if ($exes.Count -eq 0) {
            Write-Error "❌ No EXE files created!"
            exit 1
          }
          Write-Host "✅ $($exes.Count) EXE files successfully created."
        shell: pwsh

      - name: ☁️ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-exes
          path: lesclesnova360/icons/exes/*.exe
          retention-days: 3
