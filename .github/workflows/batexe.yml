name: BAT to EXE Converter

on:
  push:
    branches: [main]
    paths: ['lesclesnova360/icons/batofexe/*.bat']
  workflow_dispatch:

jobs:
  convert:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        # Crée les répertoires nécessaires
        New-Item -Path "lesclesnova360/icons/exes" -ItemType Directory -Force
        
        # Vérifie la présence de l'icône
        if (-not (Test-Path "resources/leopardoLogo.png")) {
          Write-Error "Le fichier d'icône est introuvable: resources/leopardoLogo.png"
          exit 1
        }

    - name: Download Bat to Exe Converter (version portable)
      run: |
        # Télécharge depuis le site officiel
        $url = "https://www.f2ko.de/downloads/B2E_Portable.zip"
        $output = "B2E_Portable.zip"
        
        try {
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath "BatToExeConverter"
          Remove-Item $output
        } catch {
          Write-Error "Échec du téléchargement de BatToExe Converter"
          Write-Error $_
          exit 1
        }

    - name: Convert all BAT files
      run: |
        $iconPath = (Resolve-Path "resources/leopardoLogo.png").Path
        
        Get-ChildItem -Path "lesclesnova360/icons/batofexe" -Filter *.bat | ForEach-Object {
          $batPath = $_.FullName
          $exePath = "lesclesnova360/icons/exes/$($_.BaseName).exe"
          
          Write-Host "Conversion de $($_.Name) en $exePath"
          
          # Paramètres de compilation optimisés
          $arguments = @(
            "`"$batPath`"",
            "`"$exePath`"",
            "/bat",                # Source est un fichier BAT
            "/icon `"$iconPath`"",  # Icône personnalisée
            "/compress",           # Compression pour réduire la taille
            "/merge",             # Fusionne tout en un seul EXE
            "/invisible",         # Exécution invisible
            "/noconsole",         # Pas de fenêtre console
            "/overwrite",         # Écrase si le fichier existe
            "/uac",              # Demande les droits admin si besoin
            "/fileversion 1.0.0",
            "/productname `"$($_.BaseName)`"",
            "/company `"LesClesNova360`"",
            "/description `"Script automatisé`""
          ) -join " "
          
          # Exécute le compilateur
          & "BatToExeConverter\BatToExeConverter.exe" $arguments
          
          # Vérification du résultat
          if (-not (Test-Path $exePath)) {
            Write-Error "Échec de la création de $exePath"
            exit 1
          }
          
          Write-Host "Fichier EXE créé avec succès: $exePath"
        }

    - name: Verify EXE files
      run: |
        $exes = Get-ChildItem -Path "lesclesnova360/icons/exes" -Filter *.exe
        if ($exes.Count -eq 0) {
          Write-Error "Aucun fichier EXE n'a été créé!"
          exit 1
        }
        Write-Host "$($exes.Count) fichiers EXE créés avec succès:"
        $exes | ForEach-Object { Write-Host "- $($_.Name)" }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compiled-exes
        path: lesclesnova360/icons/exes/*.exe
        retention-days: 5
