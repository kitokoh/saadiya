name: BAT to EXE Converter

on:
  push:
    branches: [main]
    paths: ['lesclesnova360/icons/batofexe/*.bat']
  workflow_dispatch:

jobs:
  convert:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        New-Item -Path "lesclesnova360/icons/exes" -ItemType Directory -Force
        if (-not (Test-Path "resources/leopardoLogo.png")) {
          Write-Error "Icon file missing: resources/leopardoLogo.png"
          exit 1
        }

    - name: Install required modules
      run: |
        Install-Module -Name ps2exe -Force -AllowClobber -Scope CurrentUser
        Install-Module -Name BatToPowershell -Force -AllowClobber -Scope CurrentUser

    - name: Convert BAT to PS1 then to EXE
      run: |
        $iconPath = (Resolve-Path "resources/leopardoLogo.png").Path
        
        Get-ChildItem -Path "lesclesnova360/icons/batofexe" -Filter *.bat | ForEach-Object {
          $batPath = $_.FullName
          $ps1Path = "$($_.DirectoryName)/$($_.BaseName).ps1"
          $exePath = "lesclesnova360/icons/exes/$($_.BaseName).exe"
          
          # Convert BAT to PS1
          Write-Host "Converting $($_.Name) to PowerShell script..."
          Convert-BatToPs1 -BatFile $batPath -Ps1File $ps1Path
          
          # Compile PS1 to EXE
          Write-Host "Compiling to $exePath"
          Invoke-PS2EXE -inputFile $ps1Path `
                       -outputFile $exePath `
                       -iconFile $iconPath `
                       -noConsole `
                       -noOutput `
                       -x86 `
                       -x64 `
                       -title "$($_.BaseName)" `
                       -company "LesClesNova360" `
                       -copyright "© LesClesNova360" `
                       -version "1.0.0"
            
          if (-not (Test-Path $exePath)) {
            Write-Error "Failed to create $exePath"
            exit 1
          }
          
          # Cleanup temporary PS1 file
          Remove-Item $ps1Path -Force
          
          Write-Host "Successfully created $exePath"
        }

    - name: Verify EXE files
      run: |
        $exes = Get-ChildItem -Path "lesclesnova360/icons/exes" -Filter *.exe
        if ($exes.Count -eq 0) {
          Write-Error "No EXE files were created!"
          exit 1
        }
        Write-Host "Created $($exes.Count) EXE files:"
        $exes | ForEach-Object { Write-Host " - $($_.Name)" }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compiled-exes
        path: lesclesnova360/icons/exes/*.exe
        retention-days: 5
