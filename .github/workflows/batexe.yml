name: BAT to EXE Converter

on:
  push:
    branches: [main]
    paths: ['lesclesnova360/icons/batofexe/*.bat']
  workflow_dispatch:

jobs:
  convert:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup environment
      run: |
        New-Item -Path "lesclesnova360/icons/exes" -ItemType Directory -Force
        if (-not (Test-Path "resources/leopardoLogo.png")) {
          Write-Error "Icon file missing: resources/leopardoLogo.png"
          exit 1
        }

    - name: Install PS2EXE (méthode alternative sans module)
      run: |
        # Télécharge directement le script PS2EXE.ps1
        $url = "https://raw.githubusercontent.com/MScholtes/PS2EXE/master/ps2exe.ps1"
        $output = "ps2exe.ps1"
        Invoke-WebRequest -Uri $url -OutFile $output
        # Crée un wrapper pour l'utiliser comme module
        New-Item -ItemType Directory -Path "ps2exe-module"
        @'
function Invoke-PS2EXE {
    param(
        [string]$inputFile,
        [string]$outputFile,
        [string]$iconFile,
        [switch]$noConsole,
        [switch]$noOutput,
        [switch]$x86,
        [switch]$x64
    )
    & "$PSScriptRoot\..\ps2exe.ps1" @PSBoundParameters
}
'@ | Out-File -FilePath "ps2exe-module\ps2exe.psm1" -Encoding utf8

    - name: Convert BAT to EXE
      run: |
        $iconPath = (Resolve-Path "resources/leopardoLogo.png").Path
        
        Get-ChildItem -Path "lesclesnova360/icons/batofexe" -Filter *.bat | ForEach-Object {
          $batContent = Get-Content -Path $_.FullName -Raw
          $ps1Path = "$($_.DirectoryName)/$($_.BaseName).ps1"
          $exePath = "lesclesnova360/icons/exes/$($_.BaseName).exe"
          
          # Convertit le BAT en PS1
          @"
# Converted from $($_.Name)
`$batScript = @'
$batContent
'@
`$lines = `$batScript -split "`r`n"
foreach (`$line in `$lines) {
    if (`$line -match "^::") { continue }
    if (`$line -match "^@") { continue }
    if (`$line -match "^ECHO OFF") { continue }
    if (`$line -match "^SET ") { 
        `$var = `$line.Substring(4).Split('=')[0].Trim()
        `$value = `$line.Split('=',2)[1].Trim()
        Set-Variable -Name `$var -Value `$value -Scope Script
        continue
    }
    Invoke-Expression `$line
}
"@ | Out-File -FilePath $ps1Path -Encoding utf8
          
          # Compile en EXE
          Import-Module ./ps2exe-module
          Invoke-PS2EXE -inputFile $ps1Path `
                       -outputFile $exePath `
                       -iconFile $iconPath `
                       -noConsole `
                       -noOutput `
                       -x86 `
                       -x64
          
          # Vérification
          if (-not (Test-Path $exePath)) {
            Write-Error "Failed to create $exePath"
            exit 1
          }
          
          # Nettoyage
          Remove-Item $ps1Path -Force
        }

    - name: Verify EXE files
      run: |
        $exes = Get-ChildItem -Path "lesclesnova360/icons/exes" -Filter *.exe
        if ($exes.Count -eq 0) {
          Write-Error "No EXE files were created!"
          exit 1
        }
        Write-Host "Successfully created $($exes.Count) EXE files"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compiled-exes
        path: lesclesnova360/icons/exes/*.exe
        retention-days: 5
