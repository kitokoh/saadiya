name: Build and Deploy PyQt App

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller main.spec

    - name: Move .exe to firebase folder
      run: |
        mkdir firebase
        copy dist\\your_app.exe firebase\\your_app.exe

    - name: Generate version.json
      run: |
        echo {"version":"1.0.1","url":"https://your-app.firebaseapp.com/your_app.exe"} > firebase/version.json

    - name: Deploy to Firebase
      uses: w9jds/firebase-action@v12.9.0
      with:
        args: deploy --only hosting
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
