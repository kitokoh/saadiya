name: "Replicate Release from Private to Public"

on:
  workflow_dispatch:
    inputs:
      dummy:
        description: 'Trigger manually'
        required: false
  release:
    types: [published, edited]

jobs:
  replicate-release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Get release info from private repo
      - name: Get release data
        id: release_data
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              let release;
              if (context.eventName === 'release') {
                release = context.payload.release;
              } else {
                // For manual trigger, get latest release
                const response = await github.rest.repos.getLatestRelease({
                  owner: 'kitokoh',
                  repo: 'saadiya'
                });
                release = response.data;
              }
              
              // Return outputs
              return {
                tag: release.tag_name,
                name: release.name || release.tag_name,
                body: release.body || '',
                draft: release.draft,
                prerelease: release.prerelease,
                assets: JSON.stringify(release.assets.map(a => ({
                  name: a.name,
                  url: a.url
                })))
              };
            } catch (error) {
              core.setFailed(`Failed to get release data: ${error.message}`);
              throw error;
            }

      # 2️⃣ Create/update release in public repo
      - name: Sync to public repo
        id: public_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TARGET_REPO_TOKEN }}
          script: |
            const { tag, name, body, draft, prerelease } = {
              tag: '${{ steps.release_data.outputs.tag }}',
              name: '${{ steps.release_data.outputs.name }}',
              body: '${{ steps.release_data.outputs.body }}',
              draft: ${{ steps.release_data.outputs.draft }},
              prerelease: ${{ steps.release_data.outputs.prerelease }}
            };

            try {
              // Try to get existing release
              const existing = await github.rest.repos.getReleaseByTag({
                owner: 'kitokoh',
                repo: 'leopardo',
                tag
              });
              
              // Update existing release
              await github.rest.repos.updateRelease({
                owner: 'kitokoh',
                repo: 'leopardo',
                release_id: existing.data.id,
                tag_name: tag,
                name,
                body,
                draft,
                prerelease
              });
              return { upload_url: existing.data.upload_url };
            } catch (error) {
              if (error.status === 404) {
                // Create new release if not found
                const created = await github.rest.repos.createRelease({
                  owner: 'kitokoh',
                  repo: 'leopardo',
                  tag_name: tag,
                  name,
                  body,
                  draft,
                  prerelease
                });
                return { upload_url: created.data.upload_url };
              }
              throw error;
            }

      # 3️⃣ Download assets from private repo
      - name: Download assets
        run: |
          mkdir -p assets
          echo '${{ steps.release_data.outputs.assets }}' | jq -c '.[]' | while read -r asset; do
            name=$(echo "$asset" | jq -r '.name')
            url=$(echo "$asset" | jq -r '.url')
            echo "Downloading $name"
            curl -sL \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              -o "assets/$name" "$url"
          done

      # 4️⃣ Upload assets to public release
      - name: Upload assets
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          repository: kitokoh/leopardo
          tag_name: ${{ steps.release_data.outputs.tag }}
          files: assets/*
          
