name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
    - name: Setup GitHub CLI
      run: |
        # Clear any existing token and authenticate with PAT
        unset GITHUB_TOKEN
        echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
        gh auth status # Verify authentication

    - name: Get latest release data
      id: get_release
      run: |
        # Get latest release or fall back to latest tag
        response=$(gh api repos/kitokoh/saadiya/releases/latest --jq '.')
        
        if [[ "$response" == "" || "$response" == "null" ]]; then
          echo "No release found. Falling back to the latest tag..."
          tag_data=$(gh api repos/kitokoh/saadiya/tags --jq '.[0]')
          
          if [[ "$tag_data" == "null" ]]; then
            echo "::error::No releases or tags found in the source repository"
            exit 1
          fi
          
          tag_name=$(echo "$tag_data" | jq -r '.name')
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "release_name=Release $tag_name" >> $GITHUB_OUTPUT
          echo "release_body=" >> $GITHUB_OUTPUT
          echo "is_draft=false" >> $GITHUB_OUTPUT
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        else
          tag_name=$(echo "$response" | jq -r '.tag_name')
          release_name=$(echo "$response" | jq -r '.name // ""')
          release_body=$(echo "$response" | jq -r '.body // ""')
          is_draft=$(echo "$response" | jq -r '.draft')
          is_prerelease=$(echo "$response" | jq -r '.prerelease')
          
          if [[ -z "$release_name" || "$release_name" == "null" ]]; then
            release_name="Release $tag_name"
          fi
          
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          echo "release_body=$release_body" >> $GITHUB_OUTPUT
          echo "is_draft=$is_draft" >> $GITHUB_OUTPUT
          echo "is_prerelease=$is_prerelease" >> $GITHUB_OUTPUT
        fi

    - name: Check if release should be skipped
      if: steps.get_release.outputs.is_draft == 'true' || steps.get_release.outputs.is_prerelease == 'true'
      run: |
        echo "Skipping because this is a draft or prerelease"
        exit 0

    - name: Create release in public repo
      run: |
        # Create a clean notes file
        notes_file=$(mktemp)
        echo -e "${{ steps.get_release.outputs.release_body }}" > "$notes_file"
        
        # Create release with proper error handling
        if ! gh release create "${{ steps.get_release.outputs.tag_name }}" \
          --repo kitokoh/leopardo \
          --title "${{ steps.get_release.outputs.release_name }}" \
          --notes-file "$notes_file" \
          --draft=false \
          --prerelease=false; then
          
          echo "::error::Failed to create release"
          exit 1
        fi
        
        echo "Release created successfully!"
        rm "$notes_file"
