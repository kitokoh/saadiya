name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
    - name: Check GitHub CLI authentication
      run: gh auth status

    - name: Get release data and EXE assets
      id: get_release
      run: |
        echo "Fetching latest release from private repo..."

        release_data=$(gh api repos/kitokoh/saadiya/releases/latest || echo "")
        if [[ -z "$release_data" || "$release_data" == "null" ]]; then
          echo "::error::No release found"
          exit 1
        fi

        tag_name=$(echo "$release_data" | jq -r '.tag_name')
        release_name=$(echo "$release_data" | jq -r '.name // empty')
        release_body=$(echo "$release_data" | jq -r '.body? // ""')
        is_draft=$(echo "$release_data" | jq -r '.draft')
        is_prerelease=$(echo "$release_data" | jq -r '.prerelease')

        [[ -z "$release_name" || "$release_name" == "null" ]] && release_name="Release $tag_name"

        mkdir -p release_assets
        cd release_assets

        echo "$release_data" | jq -r '.assets[] | select(.name | endswith(".exe")) | .browser_download_url' > ../exe_urls.txt

        while IFS= read -r url; do
          echo "Downloading $url"
          curl -sLJO -H "Authorization: token $GH_TOKEN" "$url"
        done < ../exe_urls.txt

        cd ..

        echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
        echo "release_name=$release_name" >> $GITHUB_OUTPUT
        echo "release_body=$release_body" >> $GITHUB_OUTPUT
        echo "is_draft=$is_draft" >> $GITHUB_OUTPUT
        echo "is_prerelease=$is_prerelease" >> $GITHUB_OUTPUT

    - name: Skip draft/prerelease
      if: steps.get_release.outputs.is_draft == 'true' || steps.get_release.outputs.is_prerelease == 'true'
      run: echo "Skipping draft or prerelease"

    - name: Create public release with EXE files
      if: steps.get_release.outputs.is_draft != 'true' && steps.get_release.outputs.is_prerelease != 'true'
      run: |
        echo "Creating public release..."

        notes_file=$(mktemp)
        echo "${{ steps.get_release.outputs.release_body }}" > "$notes_file"

        if compgen -G "release_assets/*.exe" > /dev/null; then
          gh release create "${{ steps.get_release.outputs.tag_name }}" \
            --repo kitokoh/leopardo \
            --title "${{ steps.get_release.outputs.release_name }}" \
            --notes-file "$notes_file" \
            release_assets/*.exe \
            --draft=false \
            --prerelease=false
        else
          echo "No .exe files to publish"
          gh release create "${{ steps.get_release.outputs.tag_name }}" \
            --repo kitokoh/leopardo \
            --title "${{ steps.get_release.outputs.release_name }}" \
            --notes-file "$notes_file" \
            --draft=false \
            --prerelease=false
        fi

        rm "$notes_file"
        rm -rf release_assets exe_urls.txt

    - name: Cleanup on failure
      if: failure()
      run: |
        echo "Cleaning up on failure..."
        rm -rf release_assets exe_urls.txt || true
