name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
    - name: Setup GitHub CLI
      run: |
        gh auth status || gh auth login --with-token <<< "$GH_TOKEN"

    - name: Get latest release data
      id: get_release
      run: |
        release=$(gh api repos/kitokoh/saadiya/releases/latest)
        
        echo "$release" > release.json
        
        echo "tag_name=$(jq -r '.tag_name' release.json)" >> "$GITHUB_OUTPUT"
        echo "release_name=$(jq -r '.name' release.json)" >> "$GITHUB_OUTPUT"
        echo "release_body=$(jq -r '.body // ""' release.json)" >> "$GITHUB_OUTPUT"
        echo "is_draft=$(jq -r '.draft' release.json)" >> "$GITHUB_OUTPUT"
        echo "is_prerelease=$(jq -r '.prerelease' release.json)" >> "$GITHUB_OUTPUT"

    - name: Exit if draft or prerelease
      if: steps.get_release.outputs.is_draft == 'true' || steps.get_release.outputs.is_prerelease == 'true'
      run: echo "Draft or prerelease. Skipping..."

    - name: Download only .exe assets
      if: steps.get_release.outputs.is_draft != 'true' && steps.get_release.outputs.is_prerelease != 'true'
      run: |
        mkdir -p release_assets
        for url in $(jq -r '.assets[] | select(.name | endswith(".exe")) | .browser_download_url' release.json); do
          echo "Downloading: $url"
          curl -L -H "Authorization: token $GH_TOKEN" -O "$url"
          mv *.exe release_assets/
        done

    - name: Publish release to public repo
      if: steps.get_release.outputs.is_draft != 'true' && steps.get_release.outputs.is_prerelease != 'true'
      run: |
        cd release_assets
        if [ "$(ls -1 *.exe 2>/dev/null | wc -l)" -eq 0 ]; then
          echo "No .exe assets found, skipping release."
          exit 0
        fi

        echo "${{ steps.get_release.outputs.release_body }}" > ../release_notes.md

        gh release create "${{ steps.get_release.outputs.tag_name }}" \
          --repo kitokoh/leopardo \
          --title "${{ steps.get_release.outputs.release_name }}" \
          --notes-file ../release_notes.md \
          --clobber \
          *.exe

    - name: Cleanup
      run: rm -rf release_assets release.json release_notes.md || true
