name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
    - name: Vérifier l'authentification GH CLI
      run: |
        gh auth status || echo "Connexion via GH_TOKEN réussie"

    - name: Récupérer les données de la release privée (EXE seulement)
      id: get_release
      run: |
        echo "Fetching latest release from private repo..."
        release_data=$(gh api repos/kitokoh/saadiya/releases/latest --jq '.' || echo "")
        
        if [[ -z "$release_data" || "$release_data" == "null" ]]; then
          echo "::error::Aucune release trouvée dans le dépôt privé"
          exit 1
        fi

        tag_name=$(echo "$release_data" | jq -r '.tag_name')
        release_name=$(echo "$release_data" | jq -r '.name')
        release_body=$(echo "$release_data" | jq -r '.body? // ""')
        is_draft=$(echo "$release_data" | jq -r '.draft')
        is_prerelease=$(echo "$release_data" | jq -r '.prerelease')

        # Lister uniquement les assets EXE (pas ZIP, pas code source)
        exe_assets=$(echo "$release_data" | jq -r '.assets[] | select(.name | endswith(".exe")) | .browser_download_url')

        mkdir -p release_assets
        cd release_assets
        for asset_url in $exe_assets; do
          echo "Downloading EXE file: $asset_url"
          curl -sLJO -H "Authorization: token $GH_TOKEN" "$asset_url"
        done
        cd ..

        echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
        echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
        echo "release_body<<EOF" >> "$GITHUB_OUTPUT"
        echo "$release_body" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
        echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

    - name: Ignorer les drafts ou pre-releases
      if: steps.get_release.outputs.is_draft == 'true' || steps.get_release.outputs.is_prerelease == 'true'
      run: echo "Release ignorée car c’est un draft ou une pre-release."

    - name: Créer la release publique avec seulement les .exe
      if: steps.get_release.outputs.is_draft != 'true' && steps.get_release.outputs.is_prerelease != 'true'
      run: |
        notes_file=$(mktemp)
        echo "${{ steps.get_release.outputs.release_body }}" > "$notes_file"

        if compgen -G "release_assets/*.exe" > /dev/null; then
          gh release create "${{ steps.get_release.outputs.tag_name }}" \
            --repo kitokoh/leopardo \
            --title "${{ steps.get_release.outputs.release_name }}" \
            --notes-file "$notes_file" \
            release_assets/*.exe \
            --draft=false \
            --prerelease=false
        else
          echo "::warning::Aucun fichier .exe trouvé. Release créée sans fichiers."
          gh release create "${{ steps.get_release.outputs.tag_name }}" \
            --repo kitokoh/leopardo \
            --title "${{ steps.get_release.outputs.release_name }}" \
            --notes-file "$notes_file" \
            --draft=false \
            --prerelease=false
        fi

        rm "$notes_file"
        rm -rf release_assets

    - name: Cleanup en cas d’échec
      if: failure()
      run: rm -rf release_assets || true
