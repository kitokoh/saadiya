name: Sync and Increment Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup GitHub CLI
      run: |
        echo "$GH_PAT" | gh auth login --with-token
        gh auth status

    - name: Get private release data
      id: get_release
      run: |
        # Récupération de la dernière release privée
        release_data=$(gh api repos/kitokoh/saadiya/releases/latest --jq '.' || echo "")
        
        if [[ -z "$release_data" || "$release_data" == "null" ]]; then
          echo "::error::Aucune release trouvée dans le dépôt source"
          exit 1
        fi

        # Extraction des métadonnées
        tag_name=$(echo "$release_data" | jq -r '.tag_name')
        release_body=$(echo "$release_data" | jq -r '.body // ""' | jq -s -R .)
        is_draft=$(echo "$release_data" | jq -r '.draft')
        is_prerelease=$(echo "$release_data" | jq -r '.prerelease')

        # Téléchargement des assets
        mkdir -p release_assets
        echo "$release_data" | jq -r '.assets[] | select(.name | endswith(".exe")) | .id' | while read asset_id; do
          asset_name=$(gh api repos/kitokoh/saadiya/releases/assets/$asset_id --jq '.name')
          echo "Téléchargement de $asset_name"
          curl -sL \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/kitokoh/saadiya/releases/assets/$asset_id" \
            -o "release_assets/$asset_name"
        done

        # Vérification des fichiers
        for file in release_assets/*.exe; do
          size=$(stat -c %s "$file")
          if [ "$size" -lt 100000000 ]; then
            echo "::error::Fichier $file corrompu (taille: $size octets)"
            exit 1
          fi
        done

        echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
        echo "release_body=$release_body" >> $GITHUB_OUTPUT
        echo "is_draft=$is_draft" >> $GITHUB_OUTPUT
        echo "is_prerelease=$is_prerelease" >> $GITHUB_OUTPUT

    - name: Skip if draft/prerelease
      if: steps.get_release.outputs.is_draft == 'true' || steps.get_release.outputs.is_prerelease == 'true'
      run: exit 0

    - name: Delete old public release
      id: delete_old
      run: |
        # Récupère la dernière release publique
        public_release=$(gh api repos/kitokoh/leopardo/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
        
        if [ -n "$public_release" ]; then
          echo "Suppression de l'ancienne release: $public_release"
          gh release delete "$public_release" --repo kitokoh/leopardo --yes
          echo "old_tag=$public_release" >> $GITHUB_OUTPUT
        else
          echo "Aucune release publique à supprimer"
          echo "old_tag=v0.0.0" >> $GITHUB_OUTPUT
        fi

    - name: Generate new version
      id: version
      run: |
        # Extraction de la version actuelle
        old_tag=${STEPS_DELETE_OLD_OUTPUTS_OLD_TAG#v}
        IFS='.' read -r major minor patch <<< "$old_tag"

        # Incrémentation
        new_patch=$((patch + 1))
        new_tag="v$major.$minor.$new_patch"

        echo "Nouvelle version: $new_tag"
        echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

    - name: Create new public release
      run: |
        # Création des notes
        notes_file=$(mktemp)
        echo -e "Nouvelle version synchronisée\n\n$(echo '${{ steps.get_release.outputs.release_body }}' | jq -r)" > "$notes_file"

        # Création de la release
        gh release create "${{ steps.version.outputs.new_tag }}" \
          --repo kitokoh/leopardo \
          --title "Version ${{ steps.version.outputs.new_tag }}" \
          --notes-file "$notes_file" \
          release_assets/*.exe

        echo "✅ Nouvelle release ${{ steps.version.outputs.new_tag }} créée avec succès"
        rm "$notes_file"

    - name: Cleanup
      if: always()
      run: rm -rf release_assets
