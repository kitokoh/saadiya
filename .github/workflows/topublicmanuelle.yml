name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
    - name: Setup GitHub CLI
      run: |
        echo "$GH_TOKEN" | gh auth login --with-token
        gh auth status

    - name: Get latest release and download .exe assets
      id: get_release
      run: |
        set -e
        mkdir -p release_assets

        # Get latest release JSON
        release_data=$(gh api repos/kitokoh/saadiya/releases/latest)
        
        # Parse values
        tag_name=$(echo "$release_data" | jq -r '.tag_name')
        release_name=$(echo "$release_data" | jq -r '.name // "Release " + .tag_name')
        release_body=$(echo "$release_data" | jq -r '.body // ""')
        is_draft=$(echo "$release_data" | jq -r '.draft')
        is_prerelease=$(echo "$release_data" | jq -r '.prerelease')

        # Stop if draft or prerelease
        if [[ "$is_draft" == "true" || "$is_prerelease" == "true" ]]; then
          echo "Release is a draft or prerelease. Skipping."
          echo "skip_release=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Download only .exe assets
        asset_urls=$(echo "$release_data" | jq -r '.assets[] | select(.name | endswith(".exe")) | .browser_download_url')
        for url in $asset_urls; do
          filename=$(basename "$url")
          echo "Downloading $filename"
          curl -L -H "Authorization: token $GH_TOKEN" -o "release_assets/$filename" "$url"
        done

        echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
        echo "release_name=$release_name" >> $GITHUB_OUTPUT
        echo "release_body<<EOF" >> $GITHUB_OUTPUT
        echo "$release_body" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        echo "skip_release=false" >> $GITHUB_OUTPUT

    - name: Create release in public repo
      if: steps.get_release.outputs.skip_release == 'false'
      run: |
        echo "Creating release in public repo..."
        notes_file=$(mktemp)
        echo "${{ steps.get_release.outputs.release_body }}" > "$notes_file"

        files=$(ls release_assets/*.exe 2>/dev/null || true)
        if [[ -n "$files" ]]; then
          gh release create "${{ steps.get_release.outputs.tag_name }}" \
            --repo kitokoh/leopardo \
            --title "${{ steps.get_release.outputs.release_name }}" \
            --notes-file "$notes_file" \
            release_assets/*.exe \
            --draft=false \
            --prerelease=false
        else
          echo "No .exe files found to upload."
          gh release create "${{ steps.get_release.outputs.tag_name }}" \
            --repo kitokoh/leopardo \
            --title "${{ steps.get_release.outputs.release_name }}" \
            --notes-file "$notes_file" \
            --draft=false \
            --prerelease=false
        fi
        rm "$notes_file"

    - name: Cleanup
      if: always()
      run: rm -rf release_assets
