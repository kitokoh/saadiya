name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup GitHub CLI
      run: |
        echo "$GH_PAT" | gh auth login --with-token
        gh auth status

    - name: Get latest release data
      id: get_release
      run: |
        # Récupération des données de la release
        release_data=$(gh api repos/kitokoh/saadiya/releases/latest --jq '.' || echo "")
        
        if [[ -z "$release_data" || "$release_data" == "null" ]]; then
          echo "::error::No release found in source repository"
          exit 1
        fi

        # Extraction des métadonnées (avec échappement JSON)
        tag_name=$(echo "$release_data" | jq -r '.tag_name')
        release_name=$(echo "$release_data" | jq -r '.name // ""')
        release_body=$(echo "$release_data" | jq -r '.body // ""' | jq -s -R .)
        published_at=$(echo "$release_data" | jq -r '.published_at')
        is_draft=$(echo "$release_data" | jq -r '.draft')
        is_prerelease=$(echo "$release_data" | jq -r '.prerelease')

        # Téléchargement des assets .exe
        mkdir -p release_assets
        echo "$release_data" | jq -r '.assets[] | select(.name | endswith(".exe")) | .id' | while read asset_id; do
          asset_name=$(gh api repos/kitokoh/saadiya/releases/assets/$asset_id --jq '.name')
          echo "Downloading $asset_name (ID: $asset_id)"
          
          curl -sL \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/kitokoh/saadiya/releases/assets/$asset_id" \
            -o "release_assets/$asset_name"
        done

        # Vérification des fichiers
        for file in release_assets/*.exe; do
          size=$(stat -c %s "$file")
          if [ "$size" -lt 100000000 ]; then  # 100MB minimum
            echo "::error::File $file is corrupted (size: $size bytes)"
            ls -lh release_assets/
            exit 1
          fi
        done

        # Output avec formatage correct
        echo "tag_name=$(echo $tag_name | jq -R -s)" >> $GITHUB_OUTPUT
        echo "release_name=$(echo $release_name | jq -R -s)" >> $GITHUB_OUTPUT
        echo "release_body=$release_body" >> $GITHUB_OUTPUT
        echo "published_at=$published_at" >> $GITHUB_OUTPUT
        echo "is_draft=$is_draft" >> $GITHUB_OUTPUT
        echo "is_prerelease=$is_prerelease" >> $GITHUB_OUTPUT
        echo "asset_files=$(ls release_assets/*.exe | xargs -n 1 basename | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

    - name: Skip if draft/prerelease
      if: steps.get_release.outputs.is_draft == 'true' || steps.get_release.outputs.is_prerelease == 'true'
      run: |
        echo "Skipping draft/prerelease"
        exit 0

    - name: Create public release
      if: steps.get_release.outputs.is_draft != 'true' && steps.get_release.outputs.is_prerelease != 'true'
      run: |
        # Création du fichier de notes
        notes_file=$(mktemp)
        echo -e "Originally published on: ${{ steps.get_release.outputs.published_at }}\n\n$(echo '${{ steps.get_release.outputs.release_body }}' | jq -r)" > "$notes_file"

        # Création de la release
        gh release create "${{ steps.get_release.outputs.tag_name }}" \
          --repo kitokoh/leopardo \
          --title "$(echo '${{ steps.get_release.outputs.release_name }}' | jq -r)" \
          --notes-file "$notes_file" \
          release_assets/*.exe

        # Nettoyage
        rm "$notes_file"
        echo "✅ Release synced successfully!"

    - name: Cleanup
      if: always()
      run: rm -rf release_assets
