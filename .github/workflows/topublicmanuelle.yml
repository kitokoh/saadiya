name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
    - name: Set up GitHub CLI
      run: |
        echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

    - name: Get latest release from Saadiya repo
      id: get_release
      run: |
        # Get latest release or fall back to latest tag
        release=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" \
          https://api.github.com/repos/kitokoh/saadiya/releases/latest)
        
        if [[ "$release" == *"Not Found"* ]]; then
          echo "No release found. Falling back to the latest tag..."
          tag=$(curl -s -H "Authorization: token ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/kitokoh/saadiya/tags | jq -r '.[0].name')
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "No tags found either. Exiting."
            exit 1
          fi
          echo "Using tag: $tag"
          echo "tag_name=$tag" >> $GITHUB_ENV
          echo "name=Release $tag" >> $GITHUB_ENV
          echo "body=" >> $GITHUB_ENV
          echo "draft=false" >> $GITHUB_ENV
          echo "prerelease=false" >> $GITHUB_ENV
        else
          tag_name=$(echo "$release" | jq -r '.tag_name')
          name=$(echo "$release" | jq -r '.name')
          body=$(echo "$release" | jq -r '.body')
          
          # Set default values if empty
          [[ -z "$name" || "$name" == "null" ]] && name="Release $tag_name"
          [[ -z "$body" || "$body" == "null" ]] && body=""
          
          echo "tag_name=$tag_name" >> $GITHUB_ENV
          echo "name=$name" >> $GITHUB_ENV
          echo "body=$body" >> $GITHUB_ENV
          echo "draft=$(echo "$release" | jq -r '.draft')" >> $GITHUB_ENV
          echo "prerelease=$(echo "$release" | jq -r '.prerelease')" >> $GITHUB_ENV
        fi

    - name: Check if release is draft or prerelease
      run: |
        if [[ "${{ env.draft }}" == "true" || "${{ env.prerelease }}" == "true" ]]; then
          echo "This is a draft or prerelease. Skipping publication."
          exit 0
        fi

    - name: Publish release to public repo (leopardo)
      run: |
        # Create a temporary file for the release notes
        echo "${{ env.body }}" > release_notes.md
        
        # Create the release
        gh release create "${{ env.tag_name }}" \
          --repo kitokoh/leopardo \
          --title "${{ env.name }}" \
          --notes-file release_notes.md \
          --draft=false \
          --prerelease=false

        echo "Release published to public repository successfully!"
