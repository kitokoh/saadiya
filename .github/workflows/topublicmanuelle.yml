name: Mirror Release to Public Repo

on:
  release:
    types: [published]     # Déclenchement automatique
  workflow_dispatch:        # Déclenchement manuel

jobs:
  mirror-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v3

      - name: Set up tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get latest release info
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          release=$(gh api repos/kitokoh/Saadya/releases/latest)
          echo "$release" > release.json

          echo "tag_name=$(jq -r .tag_name release.json)" >> $GITHUB_OUTPUT
          echo "name=$(jq -r .name release.json)" >> $GITHUB_OUTPUT
          echo "body=$(jq -r .body release.json)" >> $GITHUB_OUTPUT
          echo "draft=$(jq -r .draft release.json)" >> $GITHUB_OUTPUT
          echo "prerelease=$(jq -r .prerelease release.json)" >> $GITHUB_OUTPUT
          echo "id=$(jq -r .id release.json)" >> $GITHUB_OUTPUT

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir assets
          asset_urls=$(gh api repos/kitokoh/Saadya/releases/${{ steps.get_release.outputs.id }}/assets --jq '.[].url')
          for url in $asset_urls; do
            name=$(gh api "$url" --jq .name)
            echo "Downloading $name..."
            curl -L -H "Authorization: token $GH_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 "$url" -o "assets/$name"
          done

      - name: Create release on public repo
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh release create "${{ steps.get_release.outputs.tag_name }}" \
            --repo kitokoh/leopardo \
            --title "${{ steps.get_release.outputs.name }}" \
            --notes "${{ steps.get_release.outputs.body }}" \
            $([[ "${{ steps.get_release.outputs.draft }}" == "true" ]] && echo "--draft") \
            $([[ "${{ steps.get_release.outputs.prerelease }}" == "true" ]] && echo "--prerelease")

      - name: Upload assets to public release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for file in assets/*; do
            echo "Uploading $file..."
            gh release upload "${{ steps.get_release.outputs.tag_name }}" "$file" \
              --repo kitokoh/leopardo \
              --clobber
          done
