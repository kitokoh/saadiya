name: Test & Replicate Release to Public

on:
  workflow_dispatch:
    inputs:
      dummy:
        description: 'Just trigger manually'
        required: false
  release:
    types: [published, edited]

jobs:
  replicate-release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération des infos de la release (auto ou manuel)
      - name: Determine release data
        id: release_data
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let r;
            if (context.eventName === 'release') {
              r = context.payload.release;
            } else {
              // invocation manuelle → on prend la dernière release dispo
              const latest = await github.rest.repos
                .getLatestRelease({
                  owner: context.repo.owner,
                  repo: 'saadiya'
                })
                .catch(() => null);
              if (!latest) {
                throw new Error('Aucune release existante à répliquer.');
              }
              r = latest.data;
            }
            return {
              tag:        r.tag_name,
              name:       r.name,
              body:       r.body,
              draft:      r.draft,
              prerelease: r.prerelease,
              assets:     JSON.stringify(
                r.assets.map(a => ({ name: a.name, url: a.url }))
              )
            };

      # 2️⃣ Création / mise à jour de la release dans le repo public
      - name: Create/update in public repo
        id: public_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TARGET_REPO_TOKEN }}
          script: |
            const owner = "kitokoh";
            const repo  = "leopardo";
            const tag   = "${{ steps.release_data.outputs.tag }}";
            const opts = {
              owner,
              repo,
              tag_name:   tag,
              name:       "${{ steps.release_data.outputs.name }}",
              body:       "${{ steps.release_data.outputs.body }}",
              draft:      ${{ steps.release_data.outputs.draft }},
              prerelease: ${{ steps.release_data.outputs.prerelease }}
            };
            let rel;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              rel = existing.data;
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: rel.id,
                ...opts
              });
            } catch {
              const created = await github.rest.repos.createRelease(opts);
              rel = created.data;
            }
            return { upload_url: rel.upload_url };

      # 3️⃣ Téléchargement des assets depuis le privé
      - name: Download private assets
        run: |
          mkdir -p assets
          echo '${{ steps.release_data.outputs.assets }}' \
            | jq -c '.[]' \
            | while read -r a; do
                n=$(echo "$a" | jq -r '.name')
                u=$(echo "$a" | jq -r '.url')
                echo "Downloading $n"
                curl -L \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/octet-stream" \
                  "$u" -o "assets/$n"
              done
        shell: bash

      # 4️⃣ Upload des assets vers la release publique
      - name: Upload assets to public release
        uses: softprops/action-gh-release@v1
        with:
          token:      ${{ secrets.TARGET_REPO_TOKEN }}
          repository: kitokoh/leopardo
          tag_name:   ${{ steps.release_data.outputs.tag }}
          files:      assets/*
