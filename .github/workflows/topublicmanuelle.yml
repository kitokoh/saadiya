name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}  # Using GH_TOKEN instead of GITHUB_TOKEN to avoid conflicts

    steps:
    - name: Setup GitHub CLI
      run: |
        gh auth status  # Verify authentication
        gh api user -H "Accept: application/vnd.github+json"  # Test API connection

    - name: Get release data
      id: get_release
      run: |
        # Try to get latest release
        release_data=$(gh api repos/kitokoh/saadiya/releases/latest --jq '.' || echo "")
        
        if [[ -z "$release_data" || "$release_data" == "null" ]]; then
          echo "No release found. Falling back to latest tag..."
          tag_data=$(gh api repos/kitokoh/saadiya/tags --jq '.[0]')
          
          if [[ "$tag_data" == "null" ]]; then
            echo "::error::No releases or tags found in source repository"
            exit 1
          fi
          
          tag_name=$(echo "$tag_data" | jq -r '.name')
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "release_name=Release $tag_name" >> $GITHUB_OUTPUT
          echo "release_body=" >> $GITHUB_OUTPUT
          echo "is_draft=false" >> $GITHUB_OUTPUT
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        else
          tag_name=$(echo "$release_data" | jq -r '.tag_name')
          release_name=$(echo "$release_data" | jq -r '.name')
          release_body=$(echo "$release_data" | jq -r '.body? // ""' | sed 's/"/\\"/g')
          is_draft=$(echo "$release_data" | jq -r '.draft')
          is_prerelease=$(echo "$release_data" | jq -r '.prerelease')
          
          # Set default name if empty
          [[ -z "$release_name" || "$release_name" == "null" ]] && release_name="Release $tag_name"
          
          # Properly escape outputs
          {
            echo "tag_name=$(echo "$tag_name" | jq -sR)"
            echo "release_name=$(echo "$release_name" | jq -sR)"
            echo "release_body=$(echo "$release_body" | jq -sR)"
            echo "is_draft=$is_draft"
            echo "is_prerelease=$is_prerelease"
          } >> $GITHUB_OUTPUT
        fi

    - name: Skip draft/prerelease
      if: steps.get_release.outputs.is_draft == 'true' || steps.get_release.outputs.is_prerelease == 'true'
      run: echo "Skipping draft/prerelease"

    - name: Create public release
      if: steps.get_release.outputs.is_draft != 'true' && steps.get_release.outputs.is_prerelease != 'true'
      run: |
        # Create properly formatted notes file
        notes_file=$(mktemp)
        echo -e "$(echo '${{ steps.get_release.outputs.release_body }}' | jq -r)" > "$notes_file"
        
        # Debug output
        echo "Creating release with:"
        echo "Tag: ${{ steps.get_release.outputs.tag_name }}"
        echo "Title: ${{ steps.get_release.outputs.release_name }}"
        echo "Notes length: $(wc -c < "$notes_file") bytes"
        
        # Create release
        gh release create "$(echo '${{ steps.get_release.outputs.tag_name }}' | jq -r)" \
          --repo kitokoh/leopardo \
          --title "$(echo '${{ steps.get_release.outputs.release_name }}' | jq -r)" \
          --notes-file "$notes_file" \
          --draft=false \
          --prerelease=false
        
        rm "$notes_file"
