name: Sync Release from Private to Public Repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      # Utilisez un nom de variable personnalisé pour éviter les conflits
      MY_GH_PAT: ${{ secrets.GH_PAT }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup GitHub CLI
      run: |
        # Authentification simple et fiable
        echo "$MY_GH_PAT" > token.txt
        gh auth login --with-token < token.txt
        rm token.txt
        gh auth status

    - name: Get latest release data
      id: get_release
      run: |
        # Récupère la dernière release du dépôt PRIVÉ
        release_data=$(gh api repos/kitokoh/saadiya/releases/latest --jq '.' || echo "")
        
        if [[ -z "$release_data" || "$release_data" == "null" ]]; then
          echo "::error::Aucune release trouvée dans le dépôt source"
          exit 1
        fi

        # Extraction des infos
        tag_name=$(echo "$release_data" | jq -r '.tag_name')
        release_name=$(echo "$release_data" | jq -r '.name // "Release $tag_name"')
        release_body=$(echo "$release_data" | jq -r '.body // ""')
        published_at=$(echo "$release_data" | jq -r '.published_at')
        is_draft=$(echo "$release_data" | jq -r '.draft')
        is_prerelease=$(echo "$release_data" | jq -r '.prerelease')

        # Télécharge UNIQUEMENT les .exe
        mkdir -p release_assets
        echo "$release_data" | jq -r '.assets[] | select(.name | endswith(".exe")) | .id' | while read asset_id; do
          echo "Téléchargement de l'asset ID: $asset_id"
          gh api repos/kitokoh/saadiya/releases/assets/$asset_id \
            -H "Accept: application/octet-stream" \
            --output "release_assets/$(gh api repos/kitokoh/saadiya/releases/assets/$asset_id --jq '.name')"
        done

        # Vérifie la taille des fichiers (au moins 100 Mo)
        for file in release_assets/*.exe; do
          size=$(stat -c %s "$file")
          if [ "$size" -lt 100000000 ]; then
            echo "::error::Fichier $file trop petit ($size octets) - Téléchargement corrompu ?"
            exit 1
          fi
        done

        # Exporte les variables pour les étapes suivantes
        echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
        echo "release_name=$release_name" >> $GITHUB_OUTPUT
        echo "release_body=$release_body" >> $GITHUB_OUTPUT
        echo "published_at=$published_at" >> $GITHUB_OUTPUT
        echo "is_draft=$is_draft" >> $GITHUB_OUTPUT
        echo "is_prerelease=$is_prerelease" >> $GITHUB_OUTPUT
        echo "asset_files=$(ls release_assets/*.exe | xargs -n 1 basename | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

    - name: Skip if draft/prerelease
      if: steps.get_release.outputs.is_draft == 'true' || steps.get_release.outputs.is_prerelease == 'true'
      run: |
        echo "Ignorer car draft ou prerelease"
        exit 0

    - name: Create public release
      if: steps.get_release.outputs.is_draft != 'true' && steps.get_release.outputs.is_prerelease != 'true'
      run: |
        # Crée une release dans le dépôt PUBLIC
        gh release create "${{ steps.get_release.outputs.tag_name }}" \
          --repo kitokoh/leopardo \
          --title "${{ steps.get_release.outputs.release_name }}" \
          --notes "Publié le: ${{ steps.get_release.outputs.published_at }}\n\n${{ steps.get_release.outputs.release_body }}" \
          release_assets/*.exe

        echo "Release synchronisée avec succès !"

    - name: Cleanup
      run: rm -rf release_assets
