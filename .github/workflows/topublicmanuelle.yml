name: Replicate Release to Public Repo

on:
  release:
    types: [published, edited]

jobs:
  replicate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch release metadata and assets
        uses: actions/github-script@v7
        id: fetch_release
        with:
          result-encoding: string
          script: |
            const release = context.payload.release;
            const assets = release.assets.map(asset => ({
              name: asset.name,
              url: asset.url
            }));
            return JSON.stringify({
              tag: release.tag_name,
              name: release.name,
              body: release.body || '',
              draft: release.draft,
              prerelease: release.prerelease,
              assets: assets
            });

      - name: Parse release outputs
        id: parse
        run: |
          echo '${{ steps.fetch_release.outputs.result }}' > release.json
          cat release.json
          echo "TAG=$(jq -r .tag release.json)" >> $GITHUB_ENV
          echo "NAME=$(jq -r .name release.json)" >> $GITHUB_ENV
          echo "BODY=$(jq -r .body release.json)" >> $GITHUB_ENV
          echo "DRAFT=$(jq -r .draft release.json)" >> $GITHUB_ENV
          echo "PRERELEASE=$(jq -r .prerelease release.json)" >> $GITHUB_ENV
          echo "ASSETS=$(jq -c .assets release.json)" >> $GITHUB_ENV

      - name: Create or update release in public repo
        uses: actions/github-script@v7
        id: create_public
        env:
          TAG: ${{ env.TAG }}
          NAME: ${{ env.NAME }}
          BODY: ${{ env.BODY }}
          DRAFT: ${{ env.DRAFT }}
          PRERELEASE: ${{ env.PRERELEASE }}
        with:
          github-token: ${{ secrets.TARGET_REPO_TOKEN }}
          script: |
            const owner = "kitokoh";
            const repo = "leopardo";
            const tag = process.env.TAG;
            const name = process.env.NAME;
            const body = process.env.BODY;
            const draft = process.env.DRAFT === 'true';
            const prerelease = process.env.PRERELEASE === 'true';

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name,
                body,
                draft,
                prerelease
              });
            } catch {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name,
                body,
                draft,
                prerelease
              });
              release = created.data;
            }

            return { upload_url: release.upload_url };

      - name: Download assets
        run: |
          mkdir assets
          echo "$ASSETS" | jq -c '.[]' | while read -r asset; do
            name=$(echo "$asset" | jq -r '.name')
            url=$(echo "$asset" | jq -r '.url')
            echo "Downloading $name ..."
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/octet-stream" \
                 "$url" --output "assets/$name"
          done

      - name: Upload assets to public release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          repository: kitokoh/leopardo
          tag_name: ${{ env.TAG }}
          files: assets/*
