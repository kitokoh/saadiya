name: Mirror Release and Tags to Public Repo

on:
  release:
    types: [published]
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  mirror-release-and-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v3

      - name: Set up tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get latest release info
        id: get_release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          release=$(gh api repos/kitokoh/saadiya/releases/latest --silent || echo "not found")
          
          if [[ "$release" == "not found" ]]; then
            echo "No release found. Checking tags..."
            # Check if a tag exists
            tag=$(gh api repos/kitokoh/saadiya/git/refs/tags | jq -r '.[-1].ref' | sed 's/refs\/tags\///')
            if [[ "$tag" == "null" ]]; then
              echo "No tags found either. Exiting."
              exit 1
            fi
            echo "Using tag: $tag"
            echo "tag_name=$tag" >> $GITHUB_ENV
          else
            echo "$release" > release.json
            echo "tag_name=$(jq -r .tag_name release.json)" >> $GITHUB_ENV
            echo "name=$(jq -r .name release.json)" >> $GITHUB_ENV
            echo "body=$(jq -r .body release.json | jq -sRr @json)" >> $GITHUB_ENV
            echo "draft=$(jq -r .draft release.json)" >> $GITHUB_ENV
            echo "prerelease=$(jq -r .prerelease release.json)" >> $GITHUB_ENV
            echo "id=$(jq -r .id release.json)" >> $GITHUB_ENV
          fi

      - name: Download release assets (if release exists)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [[ "$release" != "not found" ]]; then
            mkdir assets
            asset_urls=$(gh api repos/kitokoh/saadiya/releases/${{ env.id }}/assets --jq '.[].url')
            for url in $asset_urls; do
              name=$(gh api "$url" --jq .name)
              echo "Downloading $name..."
              curl -L -H "Authorization: token $GH_TOKEN" \
                   -H "Accept: application/octet-stream" \
                   "$url" -o "assets/$name"
            done
          fi

      - name: Create release or tag on public repo
        id: create_release_or_tag
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [[ "$release" != "not found" ]]; then
            # Create release on public repo
            gh release create "${{ env.tag_name }}" \
              --repo kitokoh/leopardo \
              --title "${{ env.name }}" \
              --notes "${{ env.body }}" \
              $([[ "${{ env.draft }}" == "true" ]] && echo "--draft") \
              $([[ "${{ env.prerelease }}" == "true" ]] && echo "--prerelease")
          else
            # Create tag on public repo
            gh tag create "${{ env.tag_name }}" --repo kitokoh/leopardo
            gh push origin "${{ env.tag_name }}"
            echo "Tag ${{ env.tag_name }} created and pushed to public repo"
          fi

      - name: Upload assets to public release (if release exists)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [[ "$release" != "not found" ]]; then
            for file in assets/*; do
              echo "Uploading $file..."
              gh release upload "${{ env.tag_name }}" "$file" \
                --repo kitokoh/leopardo \
                --clobber
            done
          fi
