name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🛠️ Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --icon=resources/icons/robot-icons-30504-Windows.ico main.py

      - name: ⬇️ Download Inno Setup
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "is.exe"
          Start-Process .\is.exe "/VERYSILENT /NORESTART /SP-" -Wait

      - name: ➕ Add Inno Setup to PATH
        run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append $env:GITHUB_PATH

      - name: 📦 Build installer with Inno Setup
        run: ISCC.exe main.iss
