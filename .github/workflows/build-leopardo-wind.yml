name: Build Leopardo AI Installer (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt', 'main.spec', 'resources/**']

env:
  PYTHON_VERSION: '3.11'  # Changé de 3.13 à 3.11 pour compatibilité
  APP_NAME: 'Leopardo AI'
  UPX_VERSION: '4.2.1'
  ISS_SCRIPT: 'main.iss'
  RELEASE_TAG: 'v1.9'  # Utilisez une vraie version au lieu de 'latest'
  OUTPUT_DIR: 'LeopardoAI-Installer'
  INSTALLER_NAME: 'Leopardo-AI-Setup-v1.9.exe'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: 🛠️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install PyQt5==5.15.10 pymysql psycopg2-binary cryptography
        pip install -r requirements.txt

    - name: 🔽 Download UPX
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "upx"
        echo "UPX_DIR=$pwd\upx\upx-${{ env.UPX_VERSION }}-win64" >> $env:GITHUB_ENV

    - name: 🔍 Verify resources
      shell: pwsh
      run: |
        $requiredDirs = @('resources', 'dlls', 'lesClesNova360')
        foreach ($dir in $requiredDirs) {
          if (-not (Test-Path $dir)) {
              Write-Error "❌ Dossier manquant: $dir"
              exit 1
          }
        }

        $requiredDlls = @('liblzma.dll', 'libssl-3-x64.dll', 'libcrypto-3-x64.dll')
        foreach ($dll in $requiredDlls) {
          if (-not (Test-Path "dlls\$dll")) {
              Write-Error "❌ DLL manquante: $dll"
              exit 1
          }
        }

    - name: 🧹 Clean previous builds
      run: |
        Remove-Item -Recurse -Force build, dist, ${{ env.OUTPUT_DIR }} -ErrorAction SilentlyContinue

    - name: 🔨 Build with PyInstaller
      shell: pwsh
      run: |
        $env:PYTHONPATH="$pwd"
        pyinstaller main.spec --noconfirm --clean --upx-dir "$env:UPX_DIR" --distpath "dist" --workpath "build"

        if (-not (Test-Path "dist\main.exe")) {
          Write-Error "❌ Compilation échouée"
          Get-Content "build\warn-main.txt" -ErrorAction SilentlyContinue
          exit 1
        }

    - name: 🛠️ Build Setup Installer
      shell: cmd
      run: |
        if not exist "%ISS_SCRIPT%" (
          echo ❌ Le script Inno Setup "%ISS_SCRIPT%" est introuvable.
          exit /b 1
        )
        iscc /O"${{ env.OUTPUT_DIR }}" /F"${{ env.INSTALLER_NAME }}" "%ISS_SCRIPT%"

    - name: 📂 Verify build output
      shell: pwsh
      run: |
        $installerPath = "${{ env.OUTPUT_DIR }}\${{ env.INSTALLER_NAME }}"
        if (-not (Test-Path $installerPath)) {
          Write-Error "❌ L'installeur n'a pas été créé: $installerPath"
          exit 1
        }
        Write-Output "✔ Installeur créé avec succès: $installerPath"

    - name: 📤 Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Leopardo-AI-Installer
        path: ${{ env.OUTPUT_DIR }}/${{ env.INSTALLER_NAME }}

    - name: 📤 Create GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Leopardo AI ${{ env.RELEASE_TAG }}
        body: |
          ✅ Version ${{ env.RELEASE_TAG }} compilée automatiquement.
          Inclut l'installeur Windows.
        draft: false
        prerelease: false
        files: ${{ env.OUTPUT_DIR }}/${{ env.INSTALLER_NAME }}
