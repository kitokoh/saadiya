name: Build Leopardo AI Installer Win

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt', 'main.spec', 'resources/**']

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'Leopardo AI'
  UPX_VERSION: '4.2.1'
  ISS_SCRIPT: 'main.iss'
  RELEASE_TAG: 'v1.9'
  INSTALLER_NAME: 'Leopardo-AI-Setup.exe'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: 🛠️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install PyQt5==5.15.10 pymysql psycopg2-binary cryptography
        pip install -r requirements.txt

    - name: 🔽 Download UPX
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "upx"
        echo "UPX_DIR=$pwd\upx\upx-${{ env.UPX_VERSION }}-win64" >> $env:GITHUB_ENV

    - name: 🔍 Verify resources
      shell: pwsh
      run: |
        $requiredDirs = @('resources', 'dlls', 'lesClesNova360')
        foreach ($dir in $requiredDirs) {
          if (-not (Test-Path $dir)) {
              Write-Error "❌ Dossier manquant: $dir"
              exit 1
          }
        }

        $requiredDlls = @('liblzma.dll', 'libssl-3-x64.dll', 'libcrypto-3-x64.dll')
        foreach ($dll in $requiredDlls) {
          if (-not (Test-Path "dlls\$dll")) {
              Write-Error "❌ DLL manquante: $dll"
              exit 1
          }
        }

    - name: 🧹 Clean previous builds
      run: |
        Remove-Item -Recurse -Force build, dist, LeopardoAI-Installer -ErrorAction SilentlyContinue

    - name: 🔨 Build with PyInstaller
      shell: pwsh
      run: |
        $env:PYTHONPATH="$pwd"
        pyinstaller main.spec --noconfirm --clean --upx-dir "$env:UPX_DIR" --distpath "dist" --workpath "build"

        if (-not (Test-Path "dist\main.exe")) {
          Write-Error "❌ Compilation échouée"
          Get-Content "build\warn-main.txt" -ErrorAction SilentlyContinue
          exit 1
        }

    - name: 📦 Package build
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "release" -Force | Out-Null
        Copy-Item "dist\main.exe" -Destination "release\${{ env.APP_NAME }}.exe"
        Copy-Item -Recurse "resources" -Destination "release\resources"
        Copy-Item -Recurse "dlls" -Destination "release\dlls"

    - name: 🧪 Install Inno Setup (64-bit)
      shell: pwsh
      run: |
        $innosetupUrl = "https://files.jrsoftware.org/is/6/innosetup-6.2.0.exe"
        $installerPath = "$env:RUNNER_TEMP\innosetup.exe"
        Invoke-WebRequest -Uri $innosetupUrl -OutFile $installerPath
        Start-Process -FilePath $installerPath -Args "/VERYSILENT /ALLUSERS /SUPPRESSMSGBOXES /NOCANCEL /NORESTART /CLOSEAPPLICATIONS /RESTARTAPPLICATIONS" -Wait
        echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: 🛠️ Build Setup Installer
      shell: pwsh
      run: |
        # Vérification que le fichier ISS existe
        if (-not (Test-Path "${{ env.ISS_SCRIPT }}")) {
          Write-Error "❌ Fichier ${{ env.ISS_SCRIPT }} introuvable"
          Get-ChildItem -Recurse
          exit 1
        }
        
        # Création du dossier de sortie
        New-Item -ItemType Directory -Path "LeopardoAI-Installer" -Force
        
        # Compilation avec Inno Setup
        iscc /O"LeopardoAI-Installer" /F"${{ env.INSTALLER_NAME }}" "${{ env.ISS_SCRIPT }}"
        
        # Vérification que l'installeur a été créé
        if (-not (Test-Path "LeopardoAI-Installer\${{ env.INSTALLER_NAME }}")) {
          Write-Error "❌ Échec de la création de l'installeur"
          exit 1
        }

    - name: 📤 Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.APP_NAME }} ${{ env.RELEASE_TAG }}
        body: |
          ✅ Version ${{ env.RELEASE_TAG }} compilée automatiquement.
          Contient l'application et l'installeur Windows.
        draft: false
        prerelease: false
        files: |
          release\${{ env.APP_NAME }}.exe
          LeopardoAI-Installer\${{ env.INSTALLER_NAME }}
