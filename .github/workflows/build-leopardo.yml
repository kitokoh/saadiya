name: Build Application PyQt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt', 'main.spec', 'resources/**']

env:
  PYTHON_VERSION: '3.10'
  APP_NAME: 'Nova360'
  UPX_VERSION: '4.2.1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: 🛠️ Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller==6.13.0
        pip install PyQt5==5.15.10 pymysql psycopg2-binary cryptography
        pip install -r requirements.txt

    - name: 🔽 Download UPX
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "upx"
        echo "UPX_DIR=$pwd\upx\upx-${{ env.UPX_VERSION }}-win64" >> $env:GITHUB_ENV

    - name: 🔍 Verify resources
      shell: pwsh
      run: |
        # Vérification des dossiers critiques
        $requiredDirs = @('resources', 'dlls', 'lesClesNova360')
        foreach ($dir in $requiredDirs) {
          if (-not (Test-Path $dir)) {
              Write-Error "❌ Dossier manquant: $dir"
              exit 1
          }
        }
        
        # Vérification des DLLs requises
        $requiredDlls = @('liblzma.dll', 'libssl-3-x64.dll', 'libcrypto-3-x64.dll')
        foreach ($dll in $requiredDlls) {
          if (-not (Test-Path "dlls\$dll")) {
              Write-Error "❌ DLL manquante: $dll"
              exit 1
          }
        }

    - name: 🧹 Clean previous builds
      run: |
        Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

    - name: 🔨 Build with .spec
      shell: pwsh
      run: |
        pyinstaller `
          main.spec `
          --noconfirm `
          --clean `
          --upx-dir "$env:UPX_DIR" `
          --distpath "dist" `
          --workpath "build"

        # Vérification du résultat
        if (-not (Test-Path "dist\main.exe")) {
          Write-Error "❌ La compilation a échoué"
          Get-Content "build\warn-main.txt" -ErrorAction SilentlyContinue
          exit 1
        }

    - name: 📦 Package release
      shell: pwsh
      run: |
        # Création d'un dossier structuré
        New-Item -ItemType Directory -Path "release" | Out-Null
        Copy-Item "dist\main.exe" -Destination "release\${{ env.APP_NAME }}.exe"
        Copy-Item -Recurse "resources" -Destination "release\resources"
        Copy-Item -Recurse "dlls" -Destination "release\dlls"
        
        # Création du zip
        Compress-Archive -Path "release\*" -DestinationPath "${{ env.APP_NAME }}.zip" -Force

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}_Release
        path: |
          ${{ env.APP_NAME }}.zip
          dist\main.exe
