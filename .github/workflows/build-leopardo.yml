name: Build Leopardo EXE

on:
  workflow_dispatch:  # Exécution manuelle
  push:
    branches: [ main ]
    paths: [ '**.py', 'requirements.txt', 'main.spec' ]

env:
  PYTHON_VERSION: '3.10'
  UPX_VERSION: '4.2.1'
  PYTHONUTF8: '1'  # Force l'encodage UTF-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🗄️ Cache des dépendances
      uses: actions/cache@v3
      id: cache
      with:
        path: |
          ~\AppData\Local\pip\Cache
          venv
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 🐍 Installer Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 🛠️ Configuration de l'environnement
      shell: pwsh
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m venv venv
        .\venv\Scripts\activate

    - name: 📦 Installer les dépendances
      run: |
        pip install -r requirements.txt --no-cache-dir
        pip install pyinstaller PyQt5 pymysql psycopg2 cryptography
        pip install bandit pylint pytest

    - name: 🔍 Analyse de code
      shell: pwsh
      run: |
        # Configuration Bandit sans émojis
        @"
        [bandit]
        output_format = html
        no_emoji = True
        "@ | Out-File -FilePath .bandit -Encoding utf8

        # Exécution des analyses
        pylint --fail-under=7.0 --output-format=text main.py
        bandit -c .bandit -r . -ll -f html -o bandit_report.html

    - name: 🧪 Tests unitaires
      run: |
        pytest tests/ -v --cov=. --cov-report=xml

    - name: 📦 Télécharger UPX
      shell: bash
      run: |
        curl -L -o upx.zip https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-win64.zip
        7z x upx.zip -oupx
        echo "UPX_DIR=$(pwd)/upx" >> $GITHUB_ENV

    - name: 🏷️ Définir la version
      id: version
      run: |
        $version = (Get-Content version.txt).Trim()
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "BUILD_DATE=$(Get-Date -Format 'yyyyMMdd_HHmm')" >> $env:GITHUB_OUTPUT

    - name: 🧱 Compilation (Release)
      run: |
        pyinstaller main.spec `
          --clean `
          --noconfirm `
          --upx-dir "$env:UPX_DIR" `
          --onefile `
          --name "Leopardo_${{ steps.version.outputs.VERSION }}"

    - name: 📤 Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Leopardo-${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.BUILD_DATE }}
        path: |
          dist/*.exe
          coverage.xml
          bandit_report.html
        retention-days: 7

    - name: 🚀 Create Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.exe
          bandit_report.html
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: "Leopardo v${{ steps.version.outputs.VERSION }}"
        body: |
          Build automatique du ${{ steps.version.outputs.BUILD_DATE }}
          - Commit: ${{ github.sha }}
          - Coverage: Voir les détails dans les artifacts
