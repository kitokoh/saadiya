# .github/workflows/build-leopardo.yml
name: Build Leopardo EXE

on:
  workflow_dispatch:  # Ne se déclenche que manuellement (ou par script python)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v3

    - name: 🐍 Installer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 🛠️ Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 🧱 Compiler avec PyInstaller (.spec)
      run: pyinstaller leopardo.spec

    - name: 📦 Uploader le fichier EXE compilé
      uses: actions/upload-artifact@v4
      with:
        name: leopardo-exe
        path: dist/leopardo.exe
