name: Build Leopardo EXE (Structure Racine)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt']

env:
  PYTHON_VERSION: '3.10'
  APP_NAME: 'Leopardo'
  UPX_VERSION: '4.2.1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
    # Étape 1: Initialisation
    - name: 🛠️ Checkout Code
      uses: actions/checkout@v4

    # Étape 2: Configuration Python
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 🏗️ Configurer l'environnement
      shell: pwsh
      run: |
        python -m venv venv
        .\venv\Scripts\activate
        python -m pip install --upgrade pip wheel setuptools

    # Étape 3: Installation
    - name: 📦 Installer dépendances
      shell: pwsh
      run: |
        .\venv\Scripts\activate
        pip install -r requirements.txt
        pip install pyinstaller upx pywin32 pytest



    # Étape 5: Préparation build
    - name: 🔽 Télécharger UPX
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "upx"
        echo "UPX_PATH=$pwd\upx\upx-${{ env.UPX_VERSION }}-win64\upx.exe" >> $env:GITHUB_ENV

    - name: 🧹 Nettoyage pré-build
      run: Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

    # Étape 6: Compilation
    - name: 🔨 Builder l'EXE
      shell: pwsh
      run: |
        .\venv\Scripts\activate
        $add_data = @()
        
        # Ajout automatique des dossiers à la racine
        Get-ChildItem -Directory | Where-Object {
            $_.Name -notin @('venv', 'tests', 'build', 'dist', '.github')
        } | ForEach-Object {
            $add_data += "--add-data `"$($_.Name);$($_.Name)`""
        }

        pyinstaller `
          --onefile `
          --noconsole `
          --name ${{ env.APP_NAME }} `
          --icon icon.ico `
          --upx-dir "$env:UPX_PATH" `
          $add_data `
          --clean `
          main.py

    # Étape 7: Post-build
    - name: 🏷️ Générer version
      id: version
      run: |
        $version = if (Test-Path "version.txt") { (Get-Content version.txt).Trim() } else { "1.0.0" }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "BUILD_DATE=$(Get-Date -Format 'yyyyMMdd-HHmm')" >> $env:GITHUB_OUTPUT

    - name: 📤 Publier l'artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}_${{ steps.version.outputs.VERSION }}
        path: dist/${{ env.APP_NAME }}.exe
