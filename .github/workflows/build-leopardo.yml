name: Build Leopardo EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt']

env:
  PYTHON_VERSION: '3.10'
  APP_NAME: 'Leopardo'
  UPX_VERSION: '4.2.1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: 🛠️ Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 🏗️ Create virtual environment
      shell: pwsh
      run: |
        python -m venv venv
        .\venv\Scripts\activate
        python -m pip install --upgrade pip wheel setuptools

    - name: 📦 Install Python dependencies
      shell: pwsh
      run: |
        .\venv\Scripts\activate
        # Installation spécifique pour psycopg2
        pip install wheel
        pip install psycopg2-binary==2.9.10 --no-cache-dir
        # Installation des autres requirements
        pip install -r requirements.txt --use-pep517 --no-cache-dir
        # Outils de build
        pip install pyinstaller==6.13.0

    - name: 🔽 Download UPX manually
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "upx"
        echo "UPX_DIR=$pwd\upx\upx-${{ env.UPX_VERSION }}-win64" >> $env:GITHUB_ENV

    - name: 🧹 Clean previous builds
      run: Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

    - name: 🔨 Build executable
      shell: pwsh
      run: |
        .\venv\Scripts\activate
        pyinstaller `
          --onefile `
          --noconsole `
          --name ${{ env.APP_NAME }} `
          --icon icon.ico `
          --upx-dir "$env:UPX_DIR" `
          --add-data "assets;assets" `
          --clean `
          main.py

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}_Executable
        path: dist/${{ env.APP_NAME }}.exe
