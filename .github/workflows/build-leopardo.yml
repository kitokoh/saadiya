name: Build Leopardo EXE

on:
  workflow_dispatch:  # Exécution manuelle

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v3

    - name: 🐍 Installer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 🛠️ Installer les dépendances Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 📦 Télécharger UPX (optionnel mais recommandé)
      run: |
        curl -L -o upx.zip https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip
        tar -xf upx.zip
        echo "UPX_DIR=$(pwd)/upx-4.2.1-win64" >> $GITHUB_ENV

    - name: 🧱 Compiler avec PyInstaller (.spec)
      run: |
        pyinstaller test.spec --clean --noconfirm --upx-dir "$env:UPX_DIR"

    - name: 📤 Uploader le fichier EXE compilé
      uses: actions/upload-artifact@v4
      with:
        name: leopardo-exe
        path: dist/*.exe
