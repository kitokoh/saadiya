name: Build Professionnel Leopardo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'requirements.txt', 'setup.cfg']

env:
  PYTHON_VERSION: '3.10'
  APP_NAME: 'Leopardo'
  UPX_VERSION: '4.2.1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    # Étape 1: Préparation
    - name: 🛠️ Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Étape 2: Environnement Python
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 🏗️ Créer environnement virtuel
      shell: pwsh
      run: |
        python -m venv venv
        .\venv\Scripts\activate
        python -m pip install --upgrade pip wheel setuptools

    # Étape 3: Installation complète
    - name: 📦 Installer dépendances
      shell: pwsh
      run: |
        .\venv\Scripts\activate
        pip install -r requirements.txt --no-cache-dir
        pip install pyinstaller upx pywin32 pytest
        pip install -e .  # Installation en mode développement

    # Étape 4: Tests avant compilation
    - name: 🧪 Exécuter les tests
      shell: pwsh
      run: |
        .\venv\Scripts\activate
        pytest tests/ -v --cov=src --cov-report=xml

    # Étape 5: Compilation
    - name: 🔽 Télécharger UPX
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "upx"
        echo "UPX_PATH=$pwd\upx\upx-${{ env.UPX_VERSION }}-win64\upx.exe" >> $env:GITHUB_ENV

    - name: 🧹 Nettoyer les builds précédentes
      run: Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

    - name: 🔨 Compiler l'EXE
      shell: pwsh
      run: |
        .\venv\Scripts\activate
        pyinstaller `
          --onefile `
          --noconsole `
          --name ${{ env.APP_NAME }} `
          --icon assets/icon.ico `
          --upx-dir "$env:UPX_PATH" `
          --add-data "assets;assets" `
          --clean `
          --paths venv/Lib/site-packages `
          src/main.py

    # Étape 6: Validation post-build
    - name: 🧪 Tester l'EXE compilé
      shell: pwsh
      timeout-minutes: 5
      run: |
        $testResult = Start-Process -FilePath "dist\${{ env.APP_NAME }}.exe" -ArgumentList "--test-mode" -Wait -PassThru
        if ($testResult.ExitCode -ne 0) {
          Write-Error "Le test de l'EXE a échoué"
          exit 1
        }

    # Étape 7: Packaging
    - name: 🏷️ Versioning
      id: version
      run: |
        $version = (Get-Content version.txt).Trim()
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "BUILD_DATE=$(Get-Date -Format 'yyyyMMdd-HHmmss')" >> $env:GITHUB_OUTPUT

    - name: 📤 Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}_${{ steps.version.outputs.VERSION }}_${{ steps.version.outputs.BUILD_DATE }}
        path: |
          dist/${{ env.APP_NAME }}.exe
          coverage.xml
        retention-days: 7