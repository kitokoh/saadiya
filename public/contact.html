<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import de Contacts | Leopardo AI</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .contact-manager {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-md);
    }
    
    .import-section {
      background: rgba(108, 99, 255, 0.05);
      padding: 2rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    
    .contact-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
    }
    
    .contact-table th, .contact-table td {
      padding: 12px;
      border: 1px solid #eee;
      text-align: left;
    }
    
    .contact-table th {
      background-color: var(--primary);
      color: white;
    }
    
    .contact-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    
    .preview-container {
      max-height: 500px;
      overflow-y: auto;
      margin: 1rem 0;
    }
    
    .category-tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--primary-light);
      color: white;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="download-container">
    <div class="contact-manager">
      <h1>Importation de Contacts</h1>
      
      <div class="import-section">
        <h2>Étape 1 : Sélectionnez votre fichier</h2>
        <input type="file" id="contactFile" accept=".csv, .vcf, .json">
        
        <h2>Étape 2 : Sélectionnez une catégorie</h2>
        <select id="categorySelect" class="input-field">
          <option value="clients">Clients</option>
          <option value="prospects">Prospects</option>
          <option value="fournisseurs">Fournisseurs</option>
          <option value="personnel">Personnel</option>
          <option value="autres">Autres</option>
        </select>
        
        <div class="preview-container" id="previewContainer" style="display:none">
          <h3>Aperçu des contacts (premiers 5)</h3>
          <table class="contact-table" id="previewTable">
            <thead>
              <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Entreprise</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        
        <button id="importBtn" class="submit-btn" style="display:none; margin-top:1rem">
          <span id="btnText">Importer les contacts</span>
          <i class="fas fa-spinner fa-spin" id="spinner" style="display:none"></i>
        </button>
      </div>
      
      <div class="contact-list-section">
        <h2>Contacts existants</h2>
        <input type="text" id="searchInput" placeholder="Rechercher..." class="input-field">
        <div class="table-container" style="overflow-x:auto;">
          <table class="contact-table" id="contactTable">
            <thead>
              <tr>
                <th>Nom</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Entreprise</th>
                <th>Catégorie</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="/js/contacts.js"></script>
</body>
</html>
