<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leopardo AI | Gestion des Contacts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <style>
    :root {
      --primary: #6C63FF;
      --primary-dark: #5A52E0;
      --secondary: #FF6584;
      --light: #F8F9FA;
      --dark: #2B2D42;
      --success: #28A745;
      --error: #DC3545;
      --warning: #FFC107;
      --info: #17A2B8;
      --text-primary: var(--dark);
      --text-secondary: #6C757D;
      --border-radius-sm: 4px;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
      --transition-fast: 0.15s ease;
      --transition-normal: 0.3s ease;
      --transition-slow: 0.5s ease;
    }

    [data-theme="dark"] {
      --light: #2B2D42;
      --dark: #F8F9FA;
      --text-primary: #F8F9FA;
      --text-secondary: #ADB5BD;
      --secondary: #FF8FA3;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7ff;
      color: var(--text-primary);
      margin: 0;
      padding: 20px;
      transition: var(--transition-normal);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transition: var(--transition-normal);
    }

    [data-theme="dark"] .container {
      background: #343a40;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: var(--primary);
      color: white;
      position: relative;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .import-section, .table-section {
      padding: 2rem;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    [data-theme="dark"] .import-section, 
    [data-theme="dark"] .table-section {
      border-color: rgba(255,255,255,0.1);
    }

    .file-upload {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .contact-table {
      width: 100%;
      border-collapse: collapse;
    }

    .contact-table th, .contact-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    [data-theme="dark"] .contact-table th,
    [data-theme="dark"] .contact-table td {
      border-color: rgba(255,255,255,0.1);
    }

    .contact-table th {
      background-color: var(--primary);
      color: white;
      position: sticky;
      top: 0;
    }

    .contact-table tr:hover {
      background-color: rgba(108, 99, 255, 0.03);
    }

    [data-theme="dark"] .contact-table tr:hover {
      background-color: rgba(108, 99, 255, 0.1);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: var(--border-radius-md);
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition-normal);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: rgba(108, 99, 255, 0.1);
    }

    .btn-icon {
      padding: 0.5rem;
      border-radius: 50%;
      width: 2.5rem;
      height: 2.5rem;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--border-radius-md);
      border: 1px solid var(--text-secondary);
      font-size: 1rem;
      background: transparent;
      color: var(--text-primary);
      transition: var(--transition-normal);
    }

    [data-theme="dark"] .form-control {
      border-color: rgba(255,255,255,0.3);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      display: none;
      justify-content: center;
      align-items: center;
      color: white;
      flex-direction: column;
    }

    .spinner {
      border: 5px solid rgba(255,255,255,0.3);
      border-top: 5px solid var(--primary);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .alert {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      border-radius: var(--border-radius-md);
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: var(--shadow-lg);
      z-index: 1000;
      max-width: 400px;
      animation: fadeInUp 0.5s;
    }

    .alert-success {
      background: var(--success);
      color: white;
    }

    .alert-error {
      background: var(--error);
      color: white;
    }

    .alert-info {
      background: var(--info);
      color: white;
    }

    .language-selector {
      position: relative;
    }

    .lang-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      border-radius: var(--border-radius-md);
      box-shadow: var(--shadow-md);
      display: none;
      min-width: 180px;
      overflow: hidden;
      z-index: 100;
    }

    [data-theme="dark"] .lang-dropdown {
      background: #343a40;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .lang-option {
      width: 100%;
      padding: 0.75rem 1rem;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-primary);
    }

    .lang-option:hover {
      background: rgba(108, 99, 255, 0.1);
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: var(--border-radius-lg);
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalFadeIn 0.3s;
    }

    [data-theme="dark"] .modal-content {
      background: #343a40;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .category-tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(108, 99, 255, 0.1);
      color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: white;
    }

    .login-container {
      max-width: 400px;
      margin: 5rem auto;
      padding: 2rem;
      background: white;
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-md);
    }

    [data-theme="dark"] .login-container {
      background: #343a40;
    }

    .tab-container {
      display: flex;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }

    [data-theme="dark"] .tab-container {
      border-color: rgba(255,255,255,0.1);
    }

    .tab {
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: var(--transition-normal);
    }

    .tab.active {
      border-bottom-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .tab:hover:not(.active) {
      background: rgba(108, 99, 255, 0.05);
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      
      .file-upload {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .modal-content {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Login Screen (hidden by default) -->
    <div id="loginScreen" class="login-container" style="display: none;">
      <h2 style="text-align: center; margin-bottom: 2rem;"><i class="fas fa-lock"></i> Connexion</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Mot de passe</label>
          <input type="password" id="loginPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
      </form>
    </div>

    <!-- Main App (hidden by default) -->
    <div id="mainApp" style="display: none;">
      <div class="container">
        <div class="header">
          <h1><i class="fas fa-address-book"></i> <span data-translate="contact_management">Gestion des Contacts</span></h1>
          
          <div class="header-actions">
            <button class="theme-toggle" id="themeToggle">🌙</button>
            
            <div class="language-selector">
              <button class="btn btn-outline" id="lang-current">
                <span id="current-lang-flag">🇫🇷</span>
                <span id="current-lang-name" data-translate="language_french">Français</span>
                <i class="fas fa-chevron-down"></i>
              </button>
              
              <div class="lang-dropdown" id="langDropdown">
                <button class="lang-option" data-lang="fr">
                  <span>🇫🇷</span> <span data-translate="language_french">Français</span>
                </button>
                <button class="lang-option" data-lang="en">
                  <span>🇬🇧</span> <span data-translate="language_english">English</span>
                </button>
                <button class="lang-option" data-lang="ar">
                  <span>🇸🇦</span> <span data-translate="language_arabic">العربية</span>
                </button>
              </div>
            </div>
            
            <button class="btn btn-icon btn-outline" id="logoutBtn" title="Déconnexion">
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </div>
        </div>

        <div class="tab-container">
          <div class="tab active" data-tab="contacts"><i class="fas fa-users"></i> Contacts</div>
          <div class="tab" data-tab="import"><i class="fas fa-file-import"></i> Import</div>
          <div class="tab" data-tab="settings"><i class="fas fa-cog"></i> Paramètres</div>
        </div>

        <!-- Contacts Tab -->
        <div class="tab-content" id="contactsTab">
          <div class="table-section">
            <div class="form-group" style="max-width: 400px; margin-bottom: 1.5rem;">
              <input type="text" id="searchInput" placeholder="Rechercher..." class="form-control" data-translate-ph="search_placeholder">
            </div>
            
            <div class="table-container">
              <table class="contact-table" id="contactTable">
                <thead>
                  <tr>
                    <th data-translate="column_name">Nom</th>
                    <th data-translate="column_email">Email</th>
                    <th data-translate="column_phone">Téléphone</th>
                    <th data-translate="column_company">Entreprise</th>
                    <th data-translate="column_category">Catégorie</th>
                    <th data-translate="column_actions">Actions</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Import Tab -->
        <div class="tab-content" id="importTab" style="display: none;">
          <div class="import-section">
            <h2><i class="fas fa-file-import"></i> <span data-translate="import_contacts">Importer des contacts</span></h2>
            
            <div class="file-upload">
              <input type="file" id="contactFile" accept=".csv, .vcf, .xlsx" class="form-control">
              <button id="previewBtn" class="btn btn-outline">
                <i class="fas fa-eye"></i> <span data-translate="preview">Prévisualiser</span>
              </button>
            </div>
            
            <div class="form-group">
              <label for="categorySelect" data-translate="category">Catégorie :</label>
              <select id="categorySelect" class="form-control">
                <option value="clients" data-translate="category_clients">Clients</option>
                <option value="prospects" data-translate="category_prospects">Prospects</option>
                <option value="fournisseurs" data-translate="category_suppliers">Fournisseurs</option>
                <option value="personnel" data-translate="category_staff">Personnel</option>
              </select>
            </div>
            
            <div id="previewContainer" style="display:none">
              <h3><i class="fas fa-table"></i> <span data-translate="data_preview">Aperçu des données</span></h3>
              <div class="form-group">
                <label data-translate="select_columns">Sélectionnez les colonnes à afficher :</label>
                <div id="columnCheckboxes" class="checkbox-group" style="display: flex; flex-wrap: wrap; gap: 1rem;"></div>
              </div>
              <div class="table-container">
                <table class="contact-table" id="previewTable">
                  <thead></thead>
                  <tbody></tbody>
                </table>
              </div>
              <button id="importBtn" class="btn btn-primary" style="margin-top:1rem">
                <i class="fas fa-upload"></i> <span data-translate="import_contacts_button">Importer les contacts</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Settings Tab -->
        <div class="tab-content" id="settingsTab" style="display: none;">
          <div class="import-section">
            <h2><i class="fas fa-cog"></i> Paramètres</h2>
            
            <div class="form-group">
              <label>Synchronisation automatique</label>
              <div style="display: flex; align-items: center; gap: 1rem;">
                <label class="switch">
                  <input type="checkbox" id="autoSyncToggle" checked>
                  <span class="slider round"></span>
                </label>
                <span id="autoSyncStatus">Activée</span>
              </div>
            </div>
            
            <div class="form-group">
              <label for="backupFile">Sauvegarde des données</label>
              <div class="file-upload">
                <button id="exportBtn" class="btn btn-outline">
                  <i class="fas fa-file-export"></i> Exporter les contacts
                </button>
                <input type="file" id="backupFile" accept=".json" style="display: none;">
                <button id="importBackupBtn" class="btn btn-outline">
                  <i class="fas fa-file-import"></i> Importer une sauvegarde
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span id="loadingText" data-translate="loading">Chargement...</span>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
      <div class="modal-content">
        <h2><i class="fas fa-edit"></i> <span data-translate="edit_contact">Modifier le contact</span></h2>
        <form id="editForm">
          <input type="hidden" id="editId">
          <div class="form-group">
            <label data-translate="full_name">Nom complet</label>
            <input type="text" id="editName" class="form-control" required>
          </div>
          <div class="form-group">
            <label data-translate="email">Email</label>
            <input type="email" id="editEmail" class="form-control">
          </div>
          <div class="form-group">
            <label data-translate="phone">Téléphone</label>
            <input type="tel" id="editPhone" class="form-control">
          </div>
          <div class="form-group">
            <label data-translate="company">Entreprise</label>
            <input type="text" id="editCompany" class="form-control">
          </div>
          <div class="form-group">
            <label data-translate="category">Catégorie</label>
            <select id="editCategory" class="form-control">
              <option value="clients" data-translate="category_clients">Clients</option>
              <option value="prospects" data-translate="category_prospects">Prospects</option>
              <option value="fournisseurs" data-translate="category_suppliers">Fournisseurs</option>
              <option value="personnel" data-translate="category_staff">Personnel</option>
            </select>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
            <button type="button" class="btn btn-outline" id="cancelEdit">
              <span data-translate="cancel">Annuler</span>
            </button>
            <button type="submit" class="btn btn-primary">
              <span data-translate="save">Enregistrer</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>




  <!-- Ajoutez ceci avant la balise </body> -->
<div class="modal" id="bulkEditModal">
  <div class="modal-content">
    <h2><i class="fas fa-users-cog"></i> <span data-translate="bulk_edit">Édition multiple</span></h2>
    <form id="bulkEditForm">
      <div class="form-group">
        <label data-translate="selected_contacts">Contacts sélectionnés :</label>
        <div id="selectedContactsCount">0</div>
      </div>
      <div class="form-group">
        <label data-translate="edit_field">Champ à modifier :</label>
        <select id="bulkEditField" class="form-control">
          <option value="category" data-translate="column_category">Catégorie</option>
          <option value="company" data-translate="column_company">Entreprise</option>
        </select>
      </div>
      <div class="form-group" id="bulkEditValueContainer">
        <!-- Contenu dynamique en fonction du champ sélectionné -->
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
        <button type="button" class="btn btn-outline" id="cancelBulkEdit">
          <span data-translate="cancel">Annuler</span>
        </button>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-save"></i> <span data-translate="apply_changes">Appliquer les modifications</span>
        </button>
      </div>
    </form>
  </div>
</div>

<div class="modal" id="qrCodeModal">
  <div class="modal-content" style="text-align: center;">
    <h2><i class="fas fa-qrcode"></i> <span data-translate="share_contact">Partager le contact</span></h2>
    <div id="qrCodeContainer" style="margin: 1rem auto;"></div>
    <button class="btn btn-primary" id="downloadQrCode">
      <i class="fas fa-download"></i> <span data-translate="download_qr">Télécharger QR Code</span>
    </button>
  </div>
</div>

<div class="modal" id="duplicatesModal">
  <div class="modal-content" style="max-width: 800px;">
    <h2><i class="fas fa-clone"></i> <span data-translate="duplicate_contacts">Doublons détectés</span></h2>
    <div class="table-container">
      <table class="contact-table" id="duplicatesTable">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAllDupes"></th>
            <th data-translate="column_name">Nom</th>
            <th data-translate="column_email">Email</th>
            <th data-translate="column_phone">Téléphone</th>
            <th data-translate="column_category">Catégorie</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 1rem;">
      <button class="btn btn-outline" id="mergeSelected">
        <i class="fas fa-compress-alt"></i> <span data-translate="merge_selected">Fusionner les sélectionnés</span>
      </button>
      <button class="btn btn-outline" id="ignoreDuplicates">
        <span data-translate="ignore">Ignorer</span>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="app.js"></script>  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
